<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login Form</title>

    <link rel="stylesheet" href="loginstyle.css">

</head>

<body>

    <div class="login-box">

        <h1>Login</h1>

        <form id="loginForm">

            <div class="form-row">

                <label>Email:</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email id"
                    required>

            </div>


            <div class="form-row">

                <label>Password:</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your Password"
                    required>

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <p class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>


    <script src="login.js"></script>

</body>

</html>
